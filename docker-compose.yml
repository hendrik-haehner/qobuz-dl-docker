services:
  qobuz-dl-web:
    build: .
    image: qobuz-dl-web:latest
    container_name: qobuz-dl-web
    restart: unless-stopped
    # Mit diesem Benutzer schreibt der Container auf das NAS (siehe README).
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: .env
        required: false
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./config:/home/app/.config/qobuz-dl
      # Musik-Root: Im Webinterface wählst du Unterordner davon als Speicherort.
      - ${MUSIC_DIR:-./downloads}:/downloads
      # Läuft Docker NICHT auf dem NAS: Zeile oben auskommentieren und
      # stattdessen das Volume "nas-musik" unten verwenden.
      # - nas-musik:/downloads

