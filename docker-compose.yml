# Projektname fest, damit Container Manager und `docker compose` dasselbe Projekt meinen
name: qobuz-dl-web

services:
  qobuz-dl-web:
    # Fertiges Image, von GitHub Actions gebaut (Intel/AMD und ARM).
    # Selbst bauen statt herunterladen: siehe docker-compose.dev.yml
    image: ghcr.io/hendrik-haehner/qobuz-dl-docker:latest
    container_name: qobuz-dl-web
    restart: unless-stopped
    # Mit diesem Benutzer schreibt der Container auf das NAS (siehe README).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # Werte kommen aus der Datei .env im selben Ordner
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      QOBUZ_DEFAULT_QUALITY: ${QOBUZ_DEFAULT_QUALITY:-6}
      QOBUZ_TOKEN: ${QOBUZ_TOKEN:-}
    ports:
      # Nur über einen Reverse-Proxy mit HTTPS erreichbar machen: WEB_BIND=127.0.0.1
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    volumes:
      - ./config:/home/app/.config/qobuz-dl
      # NAS-Freigaben: jede Freigabe als eigener Ordner unter /shares.
      # Im Webinterface wählst du dann Freigabe und Unterordner.
      # Synology-Beispiel (links: Pfad auf dem NAS, rechts: Name im Webinterface):
      - /volume1/music:/shares/music
      # - /volume1/Downloads:/shares/Downloads
      # Läuft Docker NICHT auf dem NAS: Freigabe per NFS/SMB-Volume (unten) einbinden
      # - nas-musik:/shares/music

